name: Deploy Order Service

on:
  # A infraestrutura AWS do estudo foi desligada; o deploy agora só roda manualmente.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (order)
        env:
          ECR_REPO: ${{ secrets.ECR_ORDER_REPO }}
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker build -t $ECR_REPO:$IMAGE_TAG ./order-service
          docker push $ECR_REPO:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Download current task definition (order)
        env:
          TASK_FAMILY: ${{ secrets.ECS_TASK_FAMILY_ORDER }}
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > task-definition.json

      - name: Update task definition image (order)
        env:
          ECR_REPO: ${{ secrets.ECR_ORDER_REPO }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          jq '.containerDefinitions[0].image = "'$ECR_REPO':'$IMAGE_TAG'" 
              | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
              task-definition.json > new-task-definition.json

      - name: Register new task definition (order)
        run: |
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Deploy to ECS (order)
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE_ORDER }}
          NEW_TASK_DEF_ARN: ${{ env.NEW_TASK_DEF_ARN }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEW_TASK_DEF_ARN"
