name: "DEV DEPLOY"


on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      aws-assume-role-arn: "arn:aws:iam::450558841901:role/GithubActionNathanLisandro"
      aws-region: "us-east-1"
      aws-statefile-s3-bucket: "ecommerceapp-us-east-1-statefile"
      aws-lock-dynamodb-table: "ecommerceapp-us-east-1-lock"